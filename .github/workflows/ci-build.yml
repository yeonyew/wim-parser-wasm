name: CI build

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # checkout, Rust 설치, cargo test,
      # wasm-bindgen 설치, npm run build,
      # test:wasm, test:browser 단계

      - name: Upload generated Wasm package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg
          if-no-files-found: error
          retention-days: 1