<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIM 상세 정보</title>
<style>
  body { font: 15px/1.65 system-ui; color: #172033; max-width: 1000px; margin: 40px auto; padding: 0 24px; }
  h1 { margin-bottom: 8px; } h2 { margin-top: 36px; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 24px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid #dfe4ed; text-align: left; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; }
  th { background: #f5f7fa; width: 34%; font-weight: 500; }
  pre { background: #f5f7fa; padding: 20px; overflow: auto; }
  #status { min-height: 26px; } summary { cursor: pointer; }
</style>
<h1>WIM 상세 정보</h1>
<p>DISM /Get-ImageInfo에 대응하는 헤더·XML 메타데이터를 표시합니다. 파일은 업로드하지 않습니다.</p>
<p>원문 값은 그대로 보존합니다. 빌드는 XML 기준이며, 빈 값과 누락 값을 구분합니다.</p>
<input id="file" type="file" accept=".wim,.esd">
<p id="status" role="status">파일을 선택하세요.</p>
<div id="report"></div>
<details id="raw" hidden><summary>전체 결과 JSON</summary><pre id="result"></pre></details>
<script type="module">
  const input = document.querySelector('#file');
  const status = document.querySelector('#status');
  const report = document.querySelector('#report');
  const output = document.querySelector('#result');
  const raw = document.querySelector('#raw');
  const worker = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
  let currentId = 0;
  function display(value) {
    if (value === null || value === undefined) return '없음 (null)';
    if (value === '') return '빈 문자열 ("")';
    if (typeof value === 'boolean') return value ? 'Yes' : 'No';
    if (Array.isArray(value)) return value.length ? value.join('\n') : '빈 목록';
    return String(value);
  }
  function table(title, rows, parent = report) {
    const heading = document.createElement('h2');
    heading.textContent = title;
    parent.append(heading);
    const table = document.createElement('table');
    const body = document.createElement('tbody');
    for (const [label, value] of rows) {
      const row = document.createElement('tr');
      const key = document.createElement('th');
      key.scope = 'row'; key.textContent = label;
      const cell = document.createElement('td'); cell.textContent = display(value);
      row.append(key, cell); body.append(row);
    }
    table.append(body); parent.append(table);
  }
  function render(info) {
    report.replaceChildren();
    const c = info.container;
    table('WIM 컨테이너', [
      ['이미지 수', info.imageCount], ['이미지 유형', c.imageType],
      ['선택한 파일 크기 (bytes)', c.fileSize], ['XML TOTALBYTES 원문', info.totalBytes],
      ['헤더 크기', c.headerSize], ['포맷 버전', `${c.formatVersion} (0x${c.formatVersion.toString(16)})`],
      ['헤더 플래그', `${c.flags} (0x${c.flags.toString(16)})`],
      ['압축 청크 크기', c.compressionChunkSize], ['WIM GUID', c.guid],
      ['분할 번호 / 전체 분할 수', `${c.partNumber} / ${c.totalParts}`],
      ['부팅 이미지 인덱스 (0: 미지정)', c.bootIndex], ['무결성 테이블 존재', c.hasIntegrityTable],
    ]);
    for (const [key, label] of [['lookupTable', '리소스 테이블'], ['xml', 'XML'], ['bootMetadata', '부팅 메타데이터'], ['integrity', '무결성 테이블']]) {
      const r = c[key];
      table(`${label} 위치`, [['오프셋', r.offset], ['저장 크기', r.size], ['원본 크기', r.originalSize], ['플래그', r.flags]]);
    }
    for (const i of info.images) {
      const section = document.createElement('section'); report.append(section);
      const rows = [
        ['Index', i.index], ['Name', i.osName], ['Display Name', i.displayName],
        ['Description', i.description], ['Display Description', i.displayDescription],
        ['Size (bytes)', i.imageSize], ['Hard Link Bytes', i.hardLinkBytes],
        ['Architecture (원문 코드)', i.architecture], ['Edition', i.edition],
        ['Product Name', i.productName], ['Installation Type', i.installationType],
        ['HAL', i.hal], ['Product Type', i.productType], ['Product Suite', i.productSuite],
        ['Version (MAJOR.MINOR.BUILD)', i.version], ['Build Version (BUILD.SPBUILD)', i.buildVersion],
        ['Major', i.majorVersion], ['Minor', i.minorVersion], ['Build', i.build],
        ['ServicePack Build', i.spBuild], ['ServicePack Level', i.spLevel],
        ['WIM Bootable (헤더 지정)', i.bootable], ['WIMBoot', i.wimBoot], ['FLAGS', i.flags],
        ['System Root', i.systemRoot], ['Languages', i.languages?.values],
        ['Language Count', i.languages?.count], ['Default Language', i.languages?.default],
        ['Default Language Index (0부터)', i.languages?.defaultIndex],
        ['Fallback Languages', i.languages?.fallbacks.map(f => `${display(f.language)} → ${f.value}`)],
        ['File Count', i.fileCount], ['Directory Count', i.directoryCount],
        ['Created (UTC, 파생값)', i.createdTime?.utc], ['Created HIGHPART', i.createdTime?.highPart], ['Created LOWPART', i.createdTime?.lowPart],
        ['Modified (UTC, 파생값)', i.modifiedTime?.utc], ['Modified HIGHPART', i.modifiedTime?.highPart], ['Modified LOWPART', i.modifiedTime?.lowPart],
      ];
      table(`이미지 ${i.index}`, rows, section);
    }
    output.textContent = JSON.stringify(info, null, 2);
    raw.hidden = false;
  }
  worker.onmessage = ({ data }) => {
    if (data.id !== currentId) return;
    if (data.error) { status.textContent = `오류: ${data.error}`; output.textContent = status.textContent; return; }
    render(data.result); status.textContent = `${data.result.imageCount}개 이미지 정보를 읽었습니다.`;
  };
  worker.onerror = event => { status.textContent = `Worker 오류: ${event.message}`; };
  input.onchange = () => {
    const id = ++currentId; const file = input.files[0];
    report.replaceChildren(); raw.hidden = true; output.textContent = '';
    if (!file) { status.textContent = '파일을 선택하세요.'; return; }
    status.textContent = '읽는 중…';
    worker.postMessage({ id, file });
  };
</script>
</html>
